server:
  port: 8081

spring:
  application:
    name: customswise-rag

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    url: jdbc:postgresql://localhost:5432/customswise_rag
    username: customswise
    password: customswise123
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # 单个 PDF 上限（含扫描件大文件）放宽到 100MB
      max-file-size: 100MB
      # 批量上传总请求上限：~ 50 份典型 PDF 或 1 份超大文件
      max-request-size: 500MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Actuator + Prometheus 指标暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: CustomsWise RAG API
    description: 跨境电商海关政策智能RAG助手 API文档
    version: 1.0.0
    contact:
      name: CustomsWise
      email: support@customswise.com
      url: https://github.com/chenghongli-eng/CustomsWise-RAG

# MiniMax API配置
minimax:
  api-key: ${MINIMAX_API_KEY:your_api_key_here}
  base-url: https://api.minimax.chat
  model: abab6.5s-chat
  embedding-model: embo-01
  rerank-model: rerank-01
  http:
    # 连接超时（毫秒）
    connect-timeout-ms: 3000
    # 读取超时（毫秒）—— 默认用于 embed/rerank；chat 调用方会覆盖到 30s
    response-timeout-ms: 5000

# Milvus向量库配置
milvus:
  host: localhost
  port: 19530
  collection-name: customswise_docs

# 迁移/对账配置
migration:
  enabled: true
  dry-run: false
  # schema drift 时是否自动 drop+recreate collection + 走 MigrationService 重灌。
  # 默认 false（保护存量数据）。Milvus 2.5 SDK 不支持给已存在的 collection 在线加 Function，
  # 所以从 v1 schema 升到含 BM25 Function 的新 schema 需要 drop 整库。
  # 一次性升级流程：开 true → 启动 → 等 MigrationService 重灌完毕 → 关回 false
  auto-recreate-collection: false

# OCR (tess4j) 配置
tesseract:
  enabled: true
  data-path: /usr/share/tesseract-ocr/4.00/tessdata
  language: chi_sim+eng
  ocr-dpi: 200
  timeout-seconds: 30

# PaddleOCR HTTP 服务（优先级 15，介于 PDFBox 和 tess4j 之间）
paddleocr:
  enabled: true
  url: http://127.0.0.1:8002/ocr
  timeout-ms: 10000
  dpi: 250
  connect-timeout-ms: 3000

# 异步摄取配置
ingest:
  executor:
    core-pool: 4
    max-pool: 16
    queue-capacity: 200

# 文件存储配置
storage:
  upload-dir: ./uploads
  max-file-size: 50MB

# RAG配置
rag:
  top-k: 10
  rerank-top-k: 5
  current-policy-boost: 2.0       #现行政策加权
  expired-policy-penalty: 0.3     #废止的片段分数
  rerank:
    # 三层重排总开关：false 时直接走 status 规则加权（不调用 rerank API）
    enabled: true
    # BGE rerank 服务地址（本地部署 bge-rerank-v2-m3）
    url: http://127.0.0.1:8001/v1/rerank
    # 连接超时（毫秒）—— 本地服务默认3s
    connect-timeout-ms: 3000
    # 读取超时（毫秒）—— bge-reranker-v2-m3 推理 10 条长中文文档通常 5~15s，留到30s；超时走降级
    timeout-ms: 30000
    # 单条 chunk 截断字符数。bge-reranker 是 cross-encoder，attention O(n²)，
    # 生产 chunk 平均 ~300字 ×10 对 ≈30s 推理；200字 ×6 对 ≈7s 够用
    max-chars-per-doc: 500
    # 送 rerank 前的候选上限（在 RAGService 状态加权排序后截）。6+ ×500字 已逼近30s超时，砍到4留余量
    candidate-cap: 4
    # 动态 candidate-cap：根据"状态加权排序后剩余 chunks 的 avgRawChars"自动选 cap，
    # 短文档多召回、长文档少召回，整体质量/性能平衡。
    # 总开关：false 时退化为固定 candidate-cap
    dynamic-cap:
      enabled: true
      # avgRaw < 此值 → 短文档档
      short-threshold-chars: 200
      # avgRaw > 此值 → 长文档档
      long-threshold-chars: 300
      short-cap: 4
      mid-cap: 3
      long-cap: 2
    # 相似度阈值：低于此值的 chunk 直接丢弃（避免送入 LLM 拉低质量）
    similarity-threshold: 0.32
    # 同 docId 最多保留的 chunk 数（解决滑窗重复）
    max-chunks-per-document: 2
    # Milvus 服务端 expr 过滤（粗召回阶段直接限定 status）
    server-side-status-filter: true
    # 自适应 dedup：召回量少时 per-doc=3，多时=2，给长文档留更多片段
    dedup-adaptive: true

# Caffeine 本地缓存（QA 问答结果缓存）
cache:
  caffeine:
    spec: maximumSize=500,expireAfterWrite=5m

# 答案可信度评估（防 LLM 幻觉）
credibility:
  top-similarity-weight: 0.7   # top chunk 相似度在置信度评分中的权重
  citation-weight: 0.3         # 文档编号引用在置信度评分中的权重
  low-confidence-threshold: 0.4  # 低于此分 → confidenceLevel="low"

# A/B 测试框架
experiments:
  enabled: false               # 默认关闭，需要时开启
