version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: customswise_pg
    environment:
      POSTGRES_USER: customswise
      POSTGRES_PASSWORD: customswise123
      POSTGRES_DB: customswise_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: